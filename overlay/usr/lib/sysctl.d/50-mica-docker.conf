# The forwarding dockerd needs to route its bridge networks: with the nftables
# firewall backend it does not enable it itself, and refuses to start without it.
# systemd-sysctl applies this file at boot; on OpenRC, /etc/init.d/docker applies
# it before dockerd starts. A leading '-' skips a key the kernel lacks (no IPv6).
net.ipv4.ip_forward = 1
-net.ipv6.conf.all.forwarding = 1
