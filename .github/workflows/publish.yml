name: publish
# Called by release.yml and upgrade.yml once the tag's archives are built and
# gated in the same run (build.yml's mica-docker-<arch> artifacts): the package
# gate over both pools, then tools/release.sh pushes them as
# ghcr.io/micaoss/mica-docker:pool.<arch>.<tag>, reads them back with no
# credential, and attaches exactly mica-docker.lock and SHA256SUMS to the release.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: mica-docker-*
          path: _out/artifacts
      # bin/mica-tools runs on the host's bun when it is the version the pinned
      # checkout declares; its container route passes no registry token.
      - name: The bun version of the pinned mica-build-tools
        id: bun
        run: |
          set -euo pipefail
          bin/mica-tools sync
          echo "version=$(sed -n 's/^ *"packageManager": *"bun@\([^"]*\)".*/\1/p' repos/mica-build-tools/package.json)" >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: The gated archives of this run
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "_out/debs/$arch"
            cp -r "_out/artifacts/mica-docker-$arch/." "_out/debs/$arch/"
          done
          rm -rf _out/artifacts
          bash tests/package-gate.sh
      - name: Publish the pools and the release assets, read back anonymously
        run: bash tools/release.sh "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
